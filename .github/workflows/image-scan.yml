name: Image scan

# Weekly rebuild of the container image and a Trivy scan of it, so fixable
# HIGH/CRITICAL vulnerabilities in the base image or OS packages show up as a
# failed workflow run (and the usual GitHub notification email).
on:
  schedule:
    - cron: '17 5 * * 1' # Mondays 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Build and scan image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Pull the base image fresh and skip the layer cache so the scan sees
      # the OS packages a rebuild today would actually ship.
      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          pull: true
          no-cache: true
          tags: tasks-selfhosted:scan

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: tasks-selfhosted:scan
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
