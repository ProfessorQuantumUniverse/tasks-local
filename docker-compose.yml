services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: tasks-selfhosted:latest
    container_name: tasks
    restart: unless-stopped

    # PID 1 that reaps zombies and forwards signals.
    init: true

    # Nginx Proxy Manager runs in a different LXC, so it cannot reach a Docker
    # network on this host: the port has to be published on the Docker LXC and
    # NPM forwards to <docker-lxc-ip>:${HOST_PORT}. See
    # docs/nginx-proxy-manager.md.
    #
    # BIND_ADDR pins the listener to one interface of the Docker LXC. Leave it
    # at 0.0.0.0 unless the LXC has several interfaces and you know which one
    # NPM comes in on.
    ports:
      - "${BIND_ADDR:-0.0.0.0}:${HOST_PORT:-8080}:8080"

    environment:
      # ── Required ──
      # Exactly the address you type in the browser. Passkeys are bound to this
      # hostname; changing it invalidates every registered passkey.
      APP_ORIGIN: ${APP_ORIGIN:?APP_ORIGIN is required, e.g. https://tasks.example.com}

      # ── Optional ──
      RP_NAME: ${RP_NAME:-Tasks}
      ACCOUNT_DISPLAY_NAME: ${ACCOUNT_DISPLAY_NAME:-Tasks}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
      SESSION_ROTATE_HOURS: ${SESSION_ROTATE_HOURS:-24}
      ENROLLMENT_TOKEN_TTL_MINUTES: ${ENROLLMENT_TOKEN_TTL_MINUTES:-15}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Local time zone, so "today" and due dates match your calendar.
      TZ: ${TZ:-Europe/Berlin}
      # Which sources may set X-Forwarded-For. The port is published on the
      # LAN now, so "private ranges" is no longer a meaningful restriction --
      # any host on the LAN is in one. Default to trusting nobody, and set
      # this to the Nginx Proxy Manager LXC's IP to get real client addresses
      # back into the rate limiter and the audit log.
      TRUST_PROXY: ${TRUST_PROXY:-false}

    volumes:
      - tasks-data:/data

    # ── Hardening ────────────────────────────────────────────────────────
    # The image ships its code read-only and the process runs as uid 1000, so
    # the only writable path is the data volume.
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Both belong under deploy.resources on current Compose: a top-level
    # `pids_limit` alongside a `deploy` block is rejected as a conflicting
    # definition of the same limit.
    deploy:
      resources:
        limits:
          memory: 512M
          pids: 256

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  tasks-data:
    name: ${DATA_VOLUME:-tasks-data}
